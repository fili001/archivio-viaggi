<style>/* Modernist — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */


:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #ec3013;
  --color-accent-2: #e15b47;
  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #fff2ef;
  --color-accent-200: #ffe0d9;
  --color-accent-300: #ffc4b8;
  --color-accent-400: #ff9783;
  --color-accent-500: #ff563c;
  --color-accent-600: #dd2b0f;
  --color-accent-700: #ae1800;
  --color-accent-800: #7c1405;
  --color-accent-900: #4d170e;

  --color-accent-2-100: #fff2ef;
  --color-accent-2-200: #ffe0da;
  --color-accent-2-300: #ffc4b9;
  --color-accent-2-400: #ff9784;
  --color-accent-2-500: #ef6853;
  --color-accent-2-600: #c94b39;
  --color-accent-2-700: #9e3526;
  --color-accent-2-800: #71261b;
  --color-accent-2-900: #471d16;

  --font-heading: "Archivo", system-ui, sans-serif;
  --font-heading-weight: 800;
  --font-body: "Archivo", system-ui, sans-serif;

  --space-1: 4.0px;
  --space-2: 8.0px;
  --space-3: 12.0px;
  --space-4: 16.0px;
  --space-6: 24.0px;
  --space-8: 32.0px;

  --radius-sm: 0px;
  --radius-md: 0px;
  --radius-lg: 0px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.grayscale{filter:grayscale(1) contrast(1.08)}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 2px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: 2px solid var(--color-divider);
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid var(--color-divider);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

</style>

<style>
  html, body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  a { color: var(--color-accent-700); }
  a:hover { color: var(--color-accent); }
  *:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .shell { max-width: 1560px; margin: 0 auto; }
  .topbar { display: flex; align-items: stretch; border-bottom: 2px solid var(--color-text); }
  .brand { font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.01em;
    text-transform: uppercase; font-size: 20px; padding: var(--space-4) var(--space-6);
    border-right: 2px solid var(--color-text); display: flex; align-items: center; gap: var(--space-3); }
  .brand .mark { width: 14px; height: 14px; background: var(--color-accent); }
  .tabs { display: flex; }
  .tab { appearance: none; background: none; border: 0; border-right: 2px solid var(--color-text);
    font: inherit; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px;
    padding: 0 var(--space-8); cursor: pointer; color: var(--color-text); text-align: left; }
  .tab:hover { background: var(--color-accent-100); }
  .tab[aria-selected="true"] { background: var(--color-accent); color: #fff; }
  .topmeta { margin-left: auto; display: flex; align-items: center; padding: 0 var(--space-6);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-neutral-700); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 2px solid var(--color-text); }
  .stat { padding: var(--space-4) var(--space-6) var(--space-6); border-right: 2px solid var(--color-text); }
  .stat:last-child { border-right: 0; }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-neutral-700); }
  .stat .v { font-family: var(--font-heading); font-weight: 800; font-size: clamp(34px, 4vw, 52px);
    line-height: 1; margin-top: var(--space-3); font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 0.42em; font-weight: 700; color: var(--color-neutral-600); margin-left: 4px; }
  .bar { height: 6px; background: var(--color-neutral-300); margin-top: var(--space-3); }
  .bar > i { display: block; height: 100%; background: var(--color-accent); }

  .body { display: grid; grid-template-columns: minmax(0,1fr) 400px; }
  .mapwrap { border-right: 2px solid var(--color-text); position: relative; min-height: 520px; }
  .maphead { display: flex; align-items: baseline; gap: var(--space-4); padding: var(--space-4) var(--space-6);
    border-bottom: 2px solid var(--color-text); }
  .maphead h2 { font-family: var(--font-heading); font-weight: 800; font-size: 15px; margin: 0;
    text-transform: uppercase; letter-spacing: 0.06em; }
  .legend { display: flex; gap: var(--space-4); margin-left: auto; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-neutral-700); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; background: var(--color-accent); }
  .swatch.tint { background: #ffc4b8; }
  .swatch.dot { border-radius: 50%; }
  .swatch.wish { background: var(--color-bg); box-shadow: inset 0 0 0 2px var(--color-accent); border-radius: 50%; }
  #map { display: block; width: 100%; cursor: grab; touch-action: none; }
  #map:active { cursor: grabbing; }
  .zoomctl { position: absolute; right: var(--space-4); bottom: var(--space-4); display: flex; flex-direction: column;
    border: 2px solid var(--color-text); background: var(--color-bg); }
  .zoomctl button { appearance: none; background: none; border: 0; border-bottom: 2px solid var(--color-text);
    font: inherit; font-weight: 700; font-size: 15px; width: 34px; height: 32px; cursor: pointer; color: var(--color-text); }
  .zoomctl button:last-child { border-bottom: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
  .zoomctl button:hover { background: var(--color-accent); color: #fff; }
  .tip { position: absolute; pointer-events: none; background: var(--color-text); color: #fff;
    font-size: 12px; padding: 6px 9px; opacity: 0; transform: translate(-50%, -140%); white-space: nowrap; }

  .side { display: flex; flex-direction: column; min-height: 0; }
  .block { border-bottom: 2px solid var(--color-text); padding: var(--space-4) var(--space-6) var(--space-6); }
  .block h3 { font-family: var(--font-heading); font-weight: 800; font-size: 12px; margin: 0 0 var(--space-4);
    text-transform: uppercase; letter-spacing: 0.1em; }
  .search { position: relative; }
  .results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 2px); background: var(--color-neutral-100);
    border: 2px solid var(--color-text); max-height: 260px; overflow: auto; box-shadow: var(--shadow-md); }
  .results button { display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--color-neutral-300); font: inherit; font-size: 13px; padding: 9px var(--space-3); cursor: pointer; }
  .results button:last-child { border-bottom: 0; }
  .results button:hover, .results button[data-active="true"] { background: var(--color-accent); color: #fff; }
  .results .sub { color: var(--color-neutral-700); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .results button:hover .sub { color: var(--color-accent-200); }
  .empty { font-size: 12px; color: var(--color-neutral-700); padding: 9px var(--space-3); }

const SEED_IT = [
  it('Torino', 'Piemonte', 45.07, 7.69), it('Barolo', 'Piemonte', 44.61, 7.94),
  it('Genova', 'Liguria', 44.41, 8.93), it('Milano', 'Lombardia', 45.46, 9.19),

  it('Bolzano', 'Trentino-Alto Adige', 46.50, 11.35), it('Bressanone', 'Trentino-Alto Adige', 46.72, 11.66),
  it('Verona', 'Veneto', 45.44, 10.99), it('Venezia', 'Veneto', 45.44, 12.33),
  it('Trieste', 'Friuli-Venezia Giulia', 45.65, 13.78), it('Bologna', 'Emilia-Romagna', 44.49, 11.34),

];

let places = load();
let scope = 'world';
let pending = null;
let world = null, countries = null, italy = null;

function load() {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    let data = null;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      // dati illeggibili: li conservo, non li sovrascrivo
      localStorage.setItem(KEY + ':corrotto', raw);
      console.warn('Dati non leggibili, conservati in ' + KEY + ':corrotto');
      return [];
    }
    if (!Array.isArray(data)) return [];
    try { restore(data); } catch (e) { console.warn(e); }
    return data;
  }
  const fresh = SEED.concat(SEED_IT);
  localStorage.setItem(KEY, JSON.stringify(fresh));
  localStorage.setItem(KEY + ':it-restore', '1');
  return fresh;
}
// ripristino una volta sola dei luoghi italiani persi
function restore(data) {
  if (localStorage.getItem(KEY + ':it-restore')) return;
  let added = 0;
  SEED_IT.forEach(s => {
    if (!data.some(p => p.scope === 'it' && norm(p.name) === norm(s.name))) { data.push(s); added++; }
  });
  localStorage.setItem(KEY + ':it-restore', '1');
  if (added) localStorage.setItem(KEY, JSON.stringify(data));
}
function save() {
  const prev = localStorage.getItem(KEY);
  if (prev) localStorage.setItem(KEY + ':bak', prev);
  localStorage.setItem(KEY, JSON.stringify(places));
  Drive.queueSync();
}
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

/* ================= Sincronizzazione con Google Drive =================
   Configurazione: sostituisci CLIENT_ID con il tuo, creato su
   https://console.cloud.google.com (OAuth Client ID, tipo "Web application").
   Vedi il file ISTRUZIONI.md incluso per i passi completi. */
const DRIVE_CONFIG = {
  CLIENT_ID: '615096548657-n8rjg7q4iilimdrit5tefkv80d2j28sj.apps.googleusercontent.com',
  SCOPES: 'https://www.googleapis.com/auth/drive.file',
  FILENAME: 'archivio-viaggi-dati.json'
};

const Drive = (function () {
  let tokenClient = null;
  let accessToken = null;
  let fileId = null;
  let signedIn = false;
  let syncTimer = null;
  let syncing = false;

  const statusEl = () => document.getElementById('syncstatus');
  const btnEl = () => document.getElementById('syncbtn');

  function setStatus(msg) { const el = statusEl(); if (el) el.textContent = msg; }

  function updateButton() {
    const b = btnEl();
    if (!b) return;
    b.textContent = signedIn ? 'Disconnetti' : 'Accedi con Google Drive';
  }

  function configured() {
    return DRIVE_CONFIG.CLIENT_ID && DRIVE_CONFIG.CLIENT_ID.indexOf('INSERISCI_QUI') === -1;
  }

  function init() {
    if (!configured()) {
      setStatus('Drive non configurato (vedi ISTRUZIONI.md)');
      const b = btnEl();
      if (b) b.disabled = true;
      return;
    }
    const tryInit = () => {
      if (typeof google === 'undefined' || !google.accounts) { setTimeout(tryInit, 200); return; }
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: DRIVE_CONFIG.CLIENT_ID,
        scope: DRIVE_CONFIG.SCOPES,
        callback: onToken
      });
      btnEl().addEventListener('click', onButtonClick);
      // tentativo di accesso silenzioso, se l'utente aveva già autorizzato in precedenza
      tokenClient.requestAccessToken({ prompt: 'none' });
    };
    tryInit();
  }

  function onButtonClick() {
    if (signedIn) { signOut(); return; }
    tokenClient.requestAccessToken({ prompt: 'consent' });
  }

  function signOut() {
    if (accessToken) { try { google.accounts.oauth2.revoke(accessToken); } catch (e) {} }
    accessToken = null; fileId = null; signedIn = false;
    updateButton(); setStatus('Solo su questo dispositivo');
  }

  async function onToken(resp) {
    if (resp.error) {
      // 'prompt: none' senza sessione precedente fallisce silenziosamente: normale al primo utilizzo
      if (resp.error !== 'immediate_failed_no_hint' && resp.error !== 'user_logged_out') {
        console.warn('Google auth:', resp.error);
      }
      return;
    }
    accessToken = resp.access_token;
    signedIn = true;
    updateButton();
    setStatus('Connessione a Drive…');
    try {
      await findOrCreateFile();
      await pullFromDrive();
      render();
      setStatus('Sincronizzato con Google Drive');
    } catch (e) {
      console.warn('Errore sincronizzazione Drive:', e);
      setStatus('Errore di sincronizzazione (dati locali al sicuro)');
    }
  }

  async function driveFetch(url, options) {
    options = options || {};
    options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + accessToken });
    const res = await fetch(url, options);
    if (res.status === 401) {
      // token scaduto: segnalo, tento un rinnovo silenzioso, il prossimo salvataggio ci riproverà
      signedIn = false;
      updateButton();
      setStatus('Sessione scaduta, rinnovo…');
      tokenClient.requestAccessToken({ prompt: '' });
      throw new Error('token scaduto, riprova tra poco');
    }
    return res;
  }

  async function findOrCreateFile() {
    const q = encodeURIComponent("name='" + DRIVE_CONFIG.FILENAME + "' and trashed=false");
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&fields=files(id,name,modifiedTime)');
    const data = await res.json();
    if (data.files && data.files.length) {
      fileId = data.files[0].id;
      return;
    }
    const metaRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: DRIVE_CONFIG.FILENAME, mimeType: 'application/json' })
    });
    const created = await metaRes.json();
    fileId = created.id;
    await pushToDrive(places);
  }

  async function pullFromDrive() {
    if (!fileId) return;
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
    if (!res.ok) return;
    const text = await res.text();
    if (!text) return;
    let data;
    try { data = JSON.parse(text); } catch (e) { console.warn('JSON non valido su Drive'); return; }
    if (Array.isArray(data) && data.length) {
      places = data;
      localStorage.setItem(KEY, JSON.stringify(places));
    }
  }

  async function pushToDrive(data) {
    if (!fileId || !accessToken) return;
    await driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  }

  function queueSync() {
    if (!signedIn || !configured()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
      if (syncing) return;
      syncing = true;
      setStatus('Sincronizzazione…');
      try {
        await pushToDrive(places);
        setStatus('Sincronizzato con Google Drive');
      } catch (e) {
        console.warn(e);
        setStatus('Sincronizzazione non riuscita, riprovo al prossimo salvataggio');
      }
      syncing = false;
    }, 800);
  }

  return { init, queueSync };
})();
const itName = en => (window.IT_PAESI[en] || en);

/* ---------- indice di ricerca ---------- */
function index() {
  if (scope === 'it') {
    return window.CITTA_ITALIA.map(c => ({ kind: 'city', name: c[0], lat: c[1], lon: c[2], place: c[3], scope: 'it' }));
  }
  const paesi = Object.values(window.IT_PAESI).map(n => ({ kind: 'country', name: n, place: 'Paese' }));
  const citta = window.CITTA_MONDO.map(c => ({ kind: 'city', name: c[0], lat: c[1], lon: c[2], place: c[3], scope: 'world' }));
  return paesi.concat(citta);
}
function inScope(p) { return p.kind === 'country' ? scope === 'world' : p.scope === scope; }
function has(item) {
  return places.some(p => p.kind === item.kind && norm(p.name) === norm(item.name) && (p.kind === 'country' || p.scope === item.scope));
}

/* ---------- ricerca ---------- */
const q = document.getElementById('q');
const resultsEl = document.getElementById('results');
q.addEventListener('input', search);
q.addEventListener('focus', search);
document.addEventListener('click', e => { if (!e.target.closest('.search')) resultsEl.hidden = true; });

function search() {
  const term = norm(q.value.trim());
  if (term.length < 1) { resultsEl.hidden = true; return; }
  const hits = index()
    .filter(i => norm(i.name).startsWith(term) || norm(i.name).includes(term))
    .sort((a, b) => (norm(a.name).startsWith(term) ? 0 : 1) - (norm(b.name).startsWith(term) ? 0 : 1) || a.name.localeCompare(b.name))
    .slice(0, 40);
  resultsEl.innerHTML = '';
  if (!hits.length) {
    resultsEl.innerHTML = '<div class="empty">Nessun risultato in elenco.</div>';
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span>Aggiungi «' + q.value.trim() + '» a mano</span> <span class="sub">indica coordinate</span>';
    b.addEventListener('click', () => {
      pending = { kind: 'city', name: q.value.trim(), place: scope === 'it' ? window.REGIONI[0] : 'Italia',
        lat: null, lon: null, scope: scope, custom: true };
      q.value = ''; resultsEl.hidden = true; renderPending();
    });
    resultsEl.appendChild(b);
  } else {
    hits.forEach(h => {
      const b = document.createElement('button');
      b.type = 'button';
      const already = has(h) ? ' · già in archivio' : '';
      b.innerHTML = '<span>' + h.name + '</span> <span class="sub">' + h.place + already + '</span>';
      b.addEventListener('click', () => { pending = Object.assign({}, h); q.value = ''; resultsEl.hidden = true; renderPending(); });
      resultsEl.appendChild(b);
    });
  }
  resultsEl.hidden = false;
}

/* ---------- modifica di una voce esistente ---------- */
function startEdit(p) {
  pending = Object.assign({}, p);
  pending.editing = p;
  if (pending.kind === 'city') pending.custom = true;
  q.value = ''; resultsEl.hidden = true;
  renderPending();
  pendingEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ---------- form di aggiunta ---------- */
const pendingEl = document.getElementById('pending');
function renderPending() {
  pendingEl.innerHTML = '';
  if (!pending) return;
  if (pending.year === undefined) pending.year = new Date().getFullYear();
  if (pending.rating === undefined) pending.rating = 8;
  if (pending.wish === undefined) pending.wish = false;

  const showLoc = pending.custom && pending.kind === 'city';
  const custom = showLoc ? '<div class="row"><label for="pl">' + (pending.scope === 'it' ? 'Regione' : 'Paese') + '</label>' +
    '<select class="input" id="pl" style="flex:1;min-width:120px">' +
    (pending.scope === 'it' ? window.REGIONI : Object.values(window.IT_PAESI).sort((a, b) => a.localeCompare(b)))
      .map(r => '<option' + (r === pending.place ? ' selected' : '') + '>' + r + '</option>').join('') +
    '</select></div>' +
    '<div class="row"><label for="la">Lat</label><input class="input yr" id="la" type="number" step="0.01" placeholder="45.07" value="' + (pending.lat != null ? pending.lat : '') + '">' +
    '<label for="lo">Lon</label><input class="input yr" id="lo" type="number" step="0.01" placeholder="7.69" value="' + (pending.lon != null ? pending.lon : '') + '"></div>' : '';

  const box = document.createElement('div');
  box.className = 'pending';
  box.innerHTML =
    (pending.editing ? '<div class="mt" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-neutral-700)">modifica</div>' : '') +
    '<div class="row"><label for="pn">Nome</label><input class="input" id="pn" style="flex:1;min-width:120px" value="' + pending.name + '"></div>' +
    (!pending.editing ? '<div class="mt" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-neutral-700)">' + (pending.custom ? 'nuovo posto' : pending.place) + '</div>' : '') +
    custom +
    '<div class="row"><label for="yr">Anno</label><input class="input yr" id="yr" type="number" min="1900" max="2100" value="' + pending.year + '">' +
    '<label for="rt">Voto /10</label><input class="input yr" id="rt" type="number" min="1" max="10" step="0.1" value="' + pending.rating + '"></div>' +
    '<div class="row"><label class="check"><input type="checkbox" id="wish"' + (pending.wish ? ' checked' : '') + '> Solo da visitare (wishlist)</label></div>' +
    '<div class="row"><button class="btn btn-primary" id="add">' + (pending.editing ? 'Salva modifiche' : 'Aggiungi all\u2019archivio') + '</button>' +
    '<button class="btn btn-ghost" id="cancel">Annulla</button></div>';
  pendingEl.appendChild(box);

  box.querySelector('#pn').addEventListener('input', e => { pending.name = e.target.value; });
  box.querySelector('#rt').addEventListener('input', e => { pending.rating = +e.target.value || null; });
  if (showLoc) {
    box.querySelector('#pl').addEventListener('change', e => { pending.place = e.target.value; });
    box.querySelector('#la').addEventListener('input', e => { pending.lat = e.target.value === '' ? null : +e.target.value; });
    box.querySelector('#lo').addEventListener('input', e => { pending.lon = e.target.value === '' ? null : +e.target.value; });
  }
  box.querySelector('#yr').addEventListener('input', e => { pending.year = +e.target.value || null; });
  box.querySelector('#yr').disabled = pending.wish;
  box.querySelector('#rt').disabled = pending.wish;
  box.querySelector('#wish').addEventListener('change', e => {
    pending.wish = e.target.checked;
    box.querySelector('#yr').disabled = e.target.checked;
    box.querySelector('#rt').disabled = e.target.checked;
  });
  box.querySelector('#cancel').addEventListener('click', () => { pending = null; renderPending(); });
  box.querySelector('#add').addEventListener('click', () => {
    if (!pending.name || !pending.name.trim()) { alert('Serve un nome.'); return; }
    if (showLoc && (pending.lat == null || pending.lon == null)) {
      alert('Servono latitudine e longitudine per mettere il posto sulla mappa.');
      return;
    }
    const keepDate = pending.editing && pending.editing.date && pending.editing.year === pending.year;
    const p = {
      kind: pending.kind, name: pending.name.trim(), place: pending.place,
      year: pending.wish ? null : pending.year, rating: pending.wish ? null : pending.rating,
      date: keepDate ? pending.editing.date : null,
      wish: pending.wish
    };
    if (pending.kind === 'city') { p.lat = pending.lat; p.lon = pending.lon; p.scope = pending.scope; }
    if (pending.editing) {
      places = places.filter(x => x !== pending.editing);
    } else if (has(p)) {
      places = places.filter(x => !(x.kind === p.kind && norm(x.name) === norm(p.name) && (p.kind === 'country' || x.scope === p.scope)));
    }
    places.push(p);
    save(); pending = null; renderPending(); render();
  });
}

/* ---------- pannello ---------- */
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
function fmtDate(p) {
  if (p.date) { const d = p.date.split('-'); return MESI[+d[1] - 1] + ' ' + d[0]; }
  return p.year || '—';
}
function ratingBadge(n) {
  if (n == null) return '';
  return '<b class="voto">' + (Math.round(n * 10) / 10).toFixed(1) + '</b><span class="voto-max">/10</span>';
}
function paesiVisitati() {
  const s = new Set();
  places.filter(p => !p.wish).forEach(p => {
    if (p.kind === 'country') s.add(p.name);
    else if (p.scope === 'world') s.add(p.place);
  });
  return s;
}
function render() {
  const items = places.filter(inScope);
  const visited = items.filter(p => !p.wish);
  const wish = items.filter(p => p.wish);
  const paesiSet = paesiVisitati();
  const paesi = paesiSet.size;
  const voti = places.filter(p => !p.wish && p.rating != null).map(p => p.rating);
  const media = voti.length ? (voti.reduce((a, b) => a + b, 0) / voti.length) : null;
  const regs = new Set(places.filter(p => p.scope === 'it' && !p.wish).map(p => p.place));
  const pct = Math.round(paesi / TOT_PAESI * 1000) / 10;

  document.getElementById('maptitle').textContent = scope === 'world' ? 'Mappa del mondo' : 'Mappa d\u2019Italia';
  document.getElementById('addlabel').textContent = scope === 'world' ? 'Aggiungi paese o città' : 'Aggiungi un posto in Italia';
  q.placeholder = scope === 'world' ? 'Cerca paese o città…' : 'Cerca città o località…';
  document.getElementById('listtitle').textContent = scope === 'world' ? 'Viaggi nel mondo' : 'Viaggi in Italia';
  document.getElementById('regionblock').hidden = scope !== 'it';
  document.getElementById('topmeta').textContent = visited.length + ' luoghi registrati';

  document.getElementById('legend').innerHTML = scope === 'world'
    ? '<span><i class="swatch"></i> paese visitato</span><span><i class="swatch dot"></i> viaggio</span><span><i class="swatch wish"></i> da visitare</span>'
    : '<span><i class="swatch tint"></i> regione visitata</span><span><i class="swatch dot"></i> luogo</span><span><i class="swatch wish"></i> da visitare</span>';

  document.getElementById('stats').innerHTML = scope === 'world'
    ? stat('Paesi visitati', paesi, '/ ' + TOT_PAESI) +
      stat('Mondo coperto', pct + '%', '', paesi / TOT_PAESI) +
      stat('Viaggi registrati', places.filter(p => p.kind === 'city' && p.scope === 'world' && !p.wish).length, '') +
      stat('Voto medio', media ? (Math.round(media * 10) / 10).toFixed(1) : '—', media ? '/ 10' : '', media ? media / 10 : undefined)
    : stat('Regioni coperte', regs.size, '/ 20', regs.size / 20) +
      stat('Luoghi in Italia', visited.length, '') +
      stat('Ultimo viaggio', lastYear(visited) || '—', '') +
      stat('In wishlist', wish.length, '');

  document.getElementById('count').textContent = visited.length + ' visitati · ' + wish.length + ' da visitare';
  document.getElementById('wishcount').textContent = 'Dati salvati sul tuo browser';

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!items.length) list.innerHTML = '<div class="empty" style="padding:var(--space-6)">Nessun posto ancora. Cercalo qui sopra.</div>';

  const byDate = (a, b) => (b.date || String(b.year || '')).localeCompare(a.date || String(a.year || '')) || a.name.localeCompare(b.name);
  const groups = new Map();
  items.forEach(p => {
    const key = p.kind === 'country' ? p.name : p.place;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });

  [...groups.entries()]
    .sort((a, b) => b[1].filter(p => !p.wish).length - a[1].filter(p => !p.wish).length || a[0].localeCompare(b[0]))
    .forEach(entry => {
      const key = entry[0], arr = entry[1];
      const open = selected != null && regKey(selected) === regKey(key);
      const vis = arr.filter(p => !p.wish);
      const gv = vis.filter(p => p.rating != null).map(p => p.rating);
      const avg = gv.length ? gv.reduce((a, b) => a + b, 0) / gv.length : null;
      const head = document.createElement('button');
      head.type = 'button';
      head.className = 'grouphead';
      head.setAttribute('aria-expanded', String(open));
      head.innerHTML = '<span class="chev">' + (open ? '\u2212' : '+') + '</span>' +
        '<span class="gname">' + key + '</span>' +
        '<span class="gmeta">' + vis.length + (arr.length - vis.length ? ' + ' + (arr.length - vis.length) + ' da fare' : '') +
        (avg != null ? ' \u00b7 ' + ratingBadge(avg) : '') + '</span>';
      head.addEventListener('click', () => selectFeature(key));
      head.addEventListener('mouseenter', () => highlight(key));
      head.addEventListener('mouseleave', () => highlight(null));
      list.appendChild(head);
      if (!open) return;

      arr.slice().sort(byDate).forEach(p => {
        const row = document.createElement('div');
        row.className = 'item sub';
        const meta = p.wish
          ? '<span class="tag tag-outline" style="font-size:10px">da visitare</span>'
          : fmtDate(p) + (p.rating != null ? ' \u00b7 ' + ratingBadge(p.rating) : '');
        row.innerHTML = '<div><div class="nm">' + p.name + '</div></div>' +
          '<div style="text-align:right;white-space:nowrap"><div class="mt">' + meta + '</div></div>';
        const edit = document.createElement('button');
        edit.className = 'del'; edit.type = 'button'; edit.textContent = '\u270e';
        edit.title = 'Modifica ' + p.name;
        edit.addEventListener('click', () => startEdit(p));
        row.appendChild(edit);
        const del = document.createElement('button');
        del.className = 'del'; del.type = 'button'; del.textContent = '\u00d7';
        del.title = 'Rimuovi ' + p.name;
        del.addEventListener('click', () => { places = places.filter(x => x !== p); save(); render(); });
        row.appendChild(del);
        row.style.gridTemplateColumns = '1fr auto 26px 26px';
        row.addEventListener('mouseenter', () => highlightCity(p.name));
        row.addEventListener('mouseleave', () => highlightCity(null));
        list.appendChild(row);
      });
    });

  const rEl = document.getElementById('regions');
  rEl.innerHTML = window.REGIONI.map(r =>
    '<span class="tag ' + (regs.has(r) ? 'tag-accent' : 'tag-neutral') + '" style="font-size:10px">' + r + '</span>').join('');

  drawMap();
}
function lastYear(items) { return items.reduce((m, p) => Math.max(m, p.year || 0), 0) || null; }
function stat(k, v, sub, frac) {
  return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v +
    (sub ? '<small>' + sub + '</small>' : '') + '</div>' +
    (frac !== undefined ? '<div class="bar"><i style="width:' + Math.min(100, frac * 100) + '%"></i></div>' : '') + '</div>';
}

/* ---------- mappa ---------- */
const svg = d3.select('#map');
const tip = document.getElementById('tip');
let currentSize = { w: 0, h: 0 };
let zoomBehaviour = null, zk = 1;
let regioni = null;
let selected = null;
let currentPath = null, currentFeats = [];

function selectFeature(name) {
  selected = (selected != null && regKey(selected) === regKey(name)) ? null : name;
  render();
  if (selected) zoomToFeature(selected); 
}
function zoomToFeature(name) {
  if (!currentPath || !zoomBehaviour) return;
  const f = currentFeats.find(d => regKey(featName(d)) === regKey(name));
  if (!f) return;
  const b = currentPath.bounds(f);
  const dx = b[1][0] - b[0][0], dy = b[1][1] - b[0][1];
  const { w, h } = currentSize;
  const k = Math.max(1, Math.min(20, 0.8 * Math.min(w / dx, h / dy)));
  const cx = (b[0][0] + b[1][0]) / 2, cy = (b[0][1] + b[1][1]) / 2;
  svg.transition().duration(600).call(zoomBehaviour.transform,
    d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-cx, -cy));
}
function highlightCity(name) {
  svg.selectAll('g[data-city] circle').attr('r', function () {
    const on = name && this.parentNode.getAttribute('data-city') === name;
    return baseR() / zk * (on ? 1.8 : 1);
  });
}

function featName(d) {
  const p = d.properties || {};
  return p.reg_name ? String(p.reg_name).split('/')[0].trim() : itName(p.name);
}
function regKey(s) { return norm(String(s).split('/')[0]).replace(/[^a-z]/g, ''); }
function regioniVisitate() {
  return new Set(places.filter(p => p.scope === 'it' && !p.wish).map(p => p.place));
}

function mapSize() {
  const box = document.querySelector('.mapwrap').getBoundingClientRect();
  const head = document.querySelector('.maphead').getBoundingClientRect();
  const w = Math.max(320, box.width);
  const h = Math.max(380, box.height - head.height);
  return { w, h };
}

function drawMap() {
  if (!countries) return;
  const { w, h } = mapSize();
  currentSize = { w, h };
  svg.attr('viewBox', '0 0 ' + w + ' ' + h).attr('height', h);
  svg.selectAll('*').remove();

  const visitedNames = new Set([...paesiVisitati()].map(norm));
  const wishNames = new Set(
    places.filter(p => p.wish).map(p => norm(p.kind === 'country' ? p.name : p.place))
      .filter(n => !visitedNames.has(n)));

  let feats, projection;
  if (scope === 'world') {
    feats = countries.features.filter(f => f.properties.name !== 'Antarctica');
    projection = d3.geoNaturalEarth1().fitExtent([[10, 10], [w - 10, h - 10]], { type: 'FeatureCollection', features: feats });
  } else if (regioni) {
    feats = regioni.features;
    projection = d3.geoMercator().fitExtent([[24, 16], [w - 24, h - 16]], regioni);
  } else {
    feats = [italy];
    projection = d3.geoMercator().fitExtent([[24, 16], [w - 24, h - 16]], italy);
  }
  const path = d3.geoPath(projection);
  currentPath = path; currentFeats = feats;

  const regVisited = new Set([...regioniVisitate()].map(regKey));
  const root = svg.append('g').attr('class', 'zoomroot');
  const g = root.append('g');
  g.selectAll('path').data(feats).join('path')
    .attr('d', path)
    .attr('data-name', d => featName(d))
    .attr('fill', d => {
      if (scope === 'it') return regVisited.has(regKey(featName(d))) ? NAT.tint : NAT.land;
      const n = norm(itName(d.properties.name));
      if (n === 'italia') return NAT.ink;
      if (visitedNames.has(n)) return NAT.accent;
      if (wishNames.has(n)) return NAT.tint;
      return NAT.land;
    })
    .attr('stroke', d => (selected && regKey(featName(d)) === regKey(selected)) ? NAT.ink : (scope === 'it' ? NAT.ink : NAT.line))
    .attr('stroke-width', d => (selected && regKey(featName(d)) === regKey(selected)) ? 2.5 : 1)
    .on('click', (e, d) => selectFeature(featName(d)))
    .style('cursor', 'pointer')
    .on('mousemove', function (e, d) {
      const n = featName(d);
      if (scope === 'it') {
        const luoghi = places.filter(p => p.scope === 'it' && !p.wish && regKey(p.place) === regKey(n)).length;
        showTip(e, n + ' · ' + (luoghi ? luoghi + (luoghi === 1 ? ' luogo' : ' luoghi') : 'mai visitata'));
      } else {
        showTip(e, n + (visitedNames.has(norm(n)) ? ' · visitato' : wishNames.has(norm(n)) ? ' · da visitare' : ''));
      }
      d3.select(this).attr('stroke', NAT.ink).attr('stroke-width', (scope === 'it' ? 2.5 : 1.5) / zk).raise();
    })
    .on('mouseleave', function () {
      hideTip();
      d3.select(this).attr('stroke', scope === 'it' ? NAT.ink : NAT.line).attr('stroke-width', 1 / zk);
    });

  // outline Italia sulla mappa mondo
  if (scope === 'world') {
    g.append('path').datum(italy).attr('d', path).attr('fill', NAT.ink)
      .attr('stroke', NAT.ink).attr('stroke-width', 0.6).style('pointer-events', 'none');
  }

  const cities = places.filter(p => p.kind === 'city' && p.scope === scope);
  const dots = root.append('g').attr('class', 'dots').selectAll('g').data(cities).join('g')
    .attr('transform', d => {
      const xy = projection([d.lon, d.lat]);
      return xy ? 'translate(' + xy[0] + ',' + xy[1] + ')' : 'translate(-99,-99)';
    })
    .attr('data-city', d => d.name);

  dots.append('circle')
    .attr('r', scope === 'it' ? 5.5 : 4.5)
    .attr('fill', d => d.wish ? NAT.bg : NAT.accent)
    .attr('stroke', d => d.wish ? NAT.accent : NAT.bg)
    .attr('stroke-width', 2)
    .style('cursor', 'pointer')
    .on('mousemove', (e, d) => showTip(e, d.name + ' \u00b7 ' + d.place + (d.wish ? ' \u00b7 da visitare' : d.year ? ' \u00b7 ' + d.year : '')))
    .on('mouseleave', hideTip)
    .on('click', (e, d) => { e.stopPropagation(); selectFeature(d.place); });

  if (scope === 'it') {
    const lab = root.append('g').attr('class', 'labels').style('pointer-events', 'none');
    const boxes = [];
    const pts = [];
    cities.forEach(d => {
      const xy = projection([d.lon, d.lat]);
      if (!xy) return;
      pts.push({ d: d, x: xy[0], y: xy[1] });
      boxes.push([xy[0] - 7, xy[1] - 7, xy[0] + 7, xy[1] + 7]);
    });
    const hits = b => boxes.some(o => !(b[2] < o[0] || b[0] > o[2] || b[3] < o[1] || b[1] > o[3]));
    pts.sort((a, b) => a.y - b.y).forEach(p => {
      const wpx = p.d.name.length * 5.7 + 4;
      const cands = [[9, 4], [-9 - wpx, 4], [9, -8], [-9 - wpx, -8], [-wpx / 2, -11], [-wpx / 2, 15],
        [16, -16], [-16 - wpx, -16], [16, 18], [-16 - wpx, 18], [-wpx / 2, -22], [-wpx / 2, 26]];
      for (let i = 0; i < cands.length; i++) {
        const ox = cands[i][0], oy = cands[i][1];
        const b = [p.x + ox, p.y + oy - 9, p.x + ox + wpx, p.y + oy + 3];
        if (hits(b)) continue;
        boxes.push(b);
        lab.append('text').datum({ x: p.x, y: p.y, ox: ox, oy: oy })
          .text(p.d.name)
          .attr('x', p.x + ox).attr('y', p.y + oy)
          .attr('font-family', 'Archivo, system-ui, sans-serif')
          .attr('font-size', 11).attr('font-weight', 600)
          .attr('fill', NAT.ink)
          .attr('paint-order', 'stroke').attr('stroke', NAT.bg).attr('stroke-width', 3);
        break;
      }
    });
  }

  // zoom e pan
  zoomBehaviour = d3.zoom().scaleExtent([1, 24])
    .translateExtent([[0, 0], [w, h]])
    .on('zoom', ev => {
      zk = ev.transform.k;
      root.attr('transform', ev.transform);
      g.selectAll('path').attr('stroke-width', 1 / zk);
      root.selectAll('.dots circle').attr('r', baseR() / zk).attr('stroke-width', 2 / zk);
      root.selectAll('.labels text')
        .attr('font-size', 11 / zk)
        .attr('x', d => d.x + d.ox / zk)
        .attr('y', d => d.y + d.oy / zk)
        .attr('stroke-width', 3 / zk);
      hideTip();
    });
  svg.call(zoomBehaviour);
  svg.call(zoomBehaviour.transform, d3.zoomIdentity);
  zk = 1;
}
function baseR() { return scope === 'it' ? 5.5 : 4.5; }

function showTip(e, text) {
  const box = document.querySelector('.mapwrap').getBoundingClientRect();
  tip.textContent = text;
  tip.style.left = (e.clientX - box.left) + 'px';
  tip.style.top = (e.clientY - box.top) + 'px';
  tip.style.opacity = 1;
}
function hideTip() { tip.style.opacity = 0; }

function highlight(name) {
  svg.selectAll('path').attr('stroke-width', function () {
    const n = this.getAttribute('data-name');
    return ((name && n && norm(n) === norm(name)) ? 2 : 1) / zk;
  }).attr('stroke', function () {
    const n = this.getAttribute('data-name');
    return (name && n && norm(n) === norm(name)) ? NAT.ink : (scope === 'it' ? NAT.ink : NAT.line);
  });
  svg.selectAll('g[data-city] circle').attr('r', function () {
    const on = name && this.parentNode.getAttribute('data-city') === name;
    return baseR() / zk * (on ? 1.7 : 1);
  });
}

/* ---------- tab, reset, resize ---------- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  scope = t.dataset.scope;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === t)));
  pending = null; renderPending(); q.value = ''; resultsEl.hidden = true; selected = null;
  render();
}));
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Rimuovere tutti i posti dall\u2019archivio?')) return;
  places = []; save(); render();
});
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawMap, 120); });
document.getElementById('zin').addEventListener('click', () => zoomBehaviour && svg.transition().duration(220).call(zoomBehaviour.scaleBy, 1.6));
document.getElementById('zout').addEventListener('click', () => zoomBehaviour && svg.transition().duration(220).call(zoomBehaviour.scaleBy, 1 / 1.6));
document.getElementById('zreset').addEventListener('click', () => {
  if (selected) { selected = null; render(); return; }
  if (zoomBehaviour) svg.transition().duration(280).call(zoomBehaviour.transform, d3.zoomIdentity);
});

d3.json((window.__resources && window.__resources.regioniIt) || 'https://cdn.jsdelivr.net/gh/openpolis/geojson-italy@master/topojson/limits_IT_regions.topo.json')
  .then(topo => {
    const layer = topo.objects.regions || topo.objects[Object.keys(topo.objects)[0]];
    regioni = topojson.feature(topo, layer);
    if (scope === 'it') drawMap();
  })
  .catch(() => {});

d3.json((window.__resources && window.__resources.worldAtlas) || 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  world = topo;
  countries = topojson.feature(topo, topo.objects.countries);
  italy = countries.features.find(f => f.properties.name === 'Italy');
  render();
});
render();
Drive.init();
</script>
